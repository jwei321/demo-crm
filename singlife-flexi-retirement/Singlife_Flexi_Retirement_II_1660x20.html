:root{
  --bg:#F4F1EA; --paper:#FFFFFF; --ink:#16181D; --ink2:#0E1013; --muted:#5F626A; --rule:#D9D3C8;
  --accent:#8C6D46; --bronze-lt:#C9B596; --gold:#E9C27A; --deep:#1F2A2E; --ivory:#F6F3EE;
  --dmuted:#9EA3A5; --drule:rgba(246,243,238,.14);
  --disp:"Inter Tight","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1); --out:cubic-bezier(.16,1,.3,1);
  --pad:clamp(20px,4.6vw,88px);
  --h1:clamp(40px,6.6vw,124px);
  --h2:clamp(32px,4.7vw,88px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
p,li{text-wrap:pretty}

/* ---------- top bar ---------- */
#bar{position:fixed;left:0;right:0;top:0;height:64px;z-index:30;display:flex;align-items:center;gap:22px;padding:0 clamp(12px,2vw,32px);background:var(--bg);border-bottom:1px solid var(--rule);transition:background .3s,color .3s,border-color .3s}
#bar.dark{background:var(--ink);color:var(--ivory);border-bottom-color:var(--drule)}
#bar .mark{height:28px;width:auto;display:block}
#bar .mark.iv{display:none}#bar.dark .mark.ik{display:none}#bar.dark .mark.iv{display:block}
#bar .sep{width:1px;height:24px;background:var(--rule)}#bar.dark .sep{background:var(--drule)}
#bar .ttl{font:500 14px var(--sans);letter-spacing:.02em;white-space:nowrap}
#bar .sec{font:600 11px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar.dark .sec{color:var(--dmuted)}
#bar .sp{flex:1}
#bar .pg{font:600 13px var(--sans);letter-spacing:.08em;min-width:56px;text-align:center}
.ib{width:44px;height:44px;border-radius:999px;border:1px solid var(--rule);background:transparent;display:grid;place-items:center}
#bar.dark .ib{border-color:var(--drule)}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.ib:disabled{opacity:.3;cursor:default}
#progress{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:linear-gradient(90deg,#8C6D46,#F3C26B 35%,#FFF4DC 50%,#2B6F73 70%,#E9A23B);transition:width .4s var(--out)}

/* ---------- screens ---------- */
#deck{position:fixed;inset:64px 0 0 0}
.scr{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;padding:clamp(26px,4.8vh,68px) var(--pad) 84px;display:flex;flex-direction:column;visibility:hidden;opacity:0;transition:opacity .45s var(--ease),visibility 0s .45s}
.scr.on{visibility:visible;opacity:1;transition:opacity .45s var(--ease)}
.scr.dark{background:var(--ink);color:var(--ivory)}
.scr.light{background:var(--bg)}
.kick{font:600 clamp(11px,.85vw,14px) var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--accent);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.dark .kick{color:var(--bronze-lt)}
.kick .n{color:var(--muted)}.dark .kick .n{color:var(--dmuted)}
.h1{font:800 var(--h1)/.92 var(--disp);letter-spacing:-.045em;margin-top:clamp(14px,2.2vh,28px)}
.h2{font:800 var(--h2)/.95 var(--disp);letter-spacing:-.04em;margin-top:clamp(12px,2vh,24px);max-width:22ch}
.h2 em,.h1 em{font-style:normal;color:var(--accent)}
.dark .h2 em,.dark .h1 em{color:var(--gold)}
.dek{font:400 clamp(16px,1.3vw,23px)/1.45 var(--sans);color:var(--muted);max-width:62ch;margin-top:clamp(12px,2vh,24px)}
.dark .dek{color:#BFC3C4}
.dek b{color:var(--ink);font-weight:600}.dark .dek b{color:var(--ivory)}
.grow{flex:1 1 auto;min-height:18px}
.fine{font:400 clamp(11.5px,.8vw,13.5px)/1.5 var(--sans);color:var(--muted);max-width:110ch}
.dark .fine{color:var(--dmuted)}
.lbl{font:600 clamp(10.5px,.78vw,13px) var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.dark .lbl{color:var(--dmuted)}
.g{color:var(--accent)}.dark .g{color:var(--gold)}

/* entry choreography */
.rv .w{display:inline-block;overflow:hidden;vertical-align:top;padding:.04em 0 .12em;margin:-.04em 0 -.12em}
.rv .w>span{display:inline-block}
.scr:not(.in) .rv .w>span{transform:translateY(112%)}
.scr.in .rv .w>span{transition:transform .95s var(--out);transition-delay:calc(var(--d,0s) + var(--i,0) * 55ms)}
.scr:not(.in) .fu{opacity:0;transform:translateY(22px)}
.scr.in .fu{transition:opacity .7s var(--ease),transform .9s var(--out);transition-delay:var(--d,.2s)}
.scr:not(.in) .streak{clip-path:inset(0 100% 0 0)}
.scr.in .streak{transition:clip-path 1.15s var(--out);transition-delay:var(--d,.15s)}
@media (prefers-reduced-motion:reduce){.scr .rv .w>span,.scr .fu,.scr .streak{transform:none!important;opacity:1!important;clip-path:none!important;transition:none!important}}

/* light-streak panels */
.streak{position:relative;display:block;overflow:hidden;border-radius:6px;background:#1a1c21;clip-path:inset(0)}
.streak i{position:absolute;top:-10%;bottom:-10%;left:0;width:240%;background:var(--g);filter:blur(3px) saturate(1.15)}
.scr.in .streak i{animation:drift 28s ease-in-out 1 forwards}
.streak b{position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,248,232,.38) 50%,transparent 65%);transform:translateX(-110%)}
.scr.in .streak b{animation:sheen 1.8s ease-in-out 1 both;animation-delay:var(--sd,.6s)}
.streak::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,12,.30),rgba(255,255,255,.07) 34%,rgba(255,255,255,0) 58%,rgba(10,10,12,.38)),repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 7px)}
@keyframes drift{to{transform:translateX(-56%)}}
@keyframes sheen{0%{transform:translateX(-110%)}100%{transform:translateX(110%)}}

/* ---------- cover ---------- */
.cov-band{height:clamp(64px,12vh,140px);margin-top:clamp(18px,3vh,36px)}
.cov-strip{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:clamp(10px,2vw,36px);align-items:end;border-top:1px solid var(--drule);padding-top:clamp(16px,2.6vh,28px)}
.cov-strip .v{font:800 clamp(28px,3.4vw,62px)/1 var(--disp);letter-spacing:-.035em;margin-top:8px}
.cov-strip .v.g{color:var(--gold)}
.cov-strip .s{font:400 clamp(12px,.9vw,15px)/1.4 var(--sans);color:var(--dmuted);margin-top:6px}
.cov-strip .ar{font:300 clamp(22px,2vw,36px) var(--sans);color:#5d6062;padding-bottom:22px}
.by{font:500 clamp(12px,.9vw,15px) var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--dmuted);margin-top:clamp(16px,2.4vh,26px)}

/* ---------- set-up steps ---------- */
.setup{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:clamp(10px,1.4vw,24px);align-items:stretch;margin-top:clamp(22px,3.6vh,44px)}
.sbox{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:clamp(16px,1.8vw,30px);display:flex;flex-direction:column}
.sbox.ink{background:var(--ink);color:var(--ivory);border-color:var(--ink)}
.sbox .no{font:800 clamp(28px,2.6vw,48px)/1 var(--disp);color:var(--accent)}
.sbox.ink .no{color:var(--gold)}
.sbox h3{font:800 clamp(21px,1.9vw,34px)/1.05 var(--disp);letter-spacing:-.025em;margin-top:12px}
.sbox p{font:400 clamp(13.5px,1.02vw,17.5px)/1.5 var(--sans);color:var(--muted);margin-top:10px}
.sbox.ink p{color:#BFC3C4}
.sbox .tag{margin-top:auto;padding-top:14px;font:600 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.sbox.ink .tag{color:var(--gold)}
.arrow{align-self:center;font:300 clamp(24px,2.2vw,40px) var(--sans);color:var(--bronze-lt)}
.why{margin-top:clamp(18px,3vh,34px);display:flex;gap:16px;align-items:flex-start;border-left:3px solid var(--bronze-lt);padding:4px 0 4px 18px;max-width:96ch}
.why p{font:400 clamp(14px,1.08vw,18.5px)/1.5 var(--sans);color:var(--muted)}
.why b{color:var(--ink);font-weight:600}
.dark .why p{color:#BFC3C4}.dark .why b{color:var(--ivory)}

/* ---------- family tree ---------- */
.tree{--cg:clamp(14px,2.4vw,44px);margin-top:clamp(18px,3vh,36px);display:grid;grid-template-columns:1fr 1fr;column-gap:var(--cg);row-gap:0;position:relative}
.root{grid-column:1/-1;justify-self:center;text-align:center;background:var(--ink);color:var(--ivory);border-radius:999px;padding:14px 34px;font:700 clamp(17px,1.4vw,24px) var(--disp);letter-spacing:-.01em}
.root small{display:block;font:500 11px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--bronze-lt);margin-bottom:4px}
.conn{grid-column:1/-1;position:relative;height:clamp(26px,4vh,44px)}
.conn i{position:absolute;border-color:var(--ink);border-style:solid;border-width:0}
.conn .v0{left:50%;top:0;height:50%;border-left-width:2px}
.conn .hz{left:calc((100% - var(--cg)) / 4);right:calc((100% - var(--cg)) / 4);top:50%;border-top-width:2px}
.conn .v1,.conn .v2{top:50%;bottom:0;border-left-width:2px}
.conn .v1{left:calc((100% - var(--cg)) / 4)}.conn .v2{right:calc((100% - var(--cg)) / 4)}
.branch{padding-top:14px;position:relative}
.branch .dt{font:800 clamp(24px,2.4vw,44px)/1 var(--disp);letter-spacing:-.035em;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.branch .dt span{font:600 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.kids{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1vw,18px);margin-top:16px}
.kid{background:var(--paper);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.kid .streak{height:clamp(50px,9vh,110px);border-radius:0}
.kid .b{padding:clamp(12px,1.2vw,20px)}
.kid .nm{font:700 clamp(17px,1.5vw,26px)/1.1 var(--disp);letter-spacing:-.02em;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.kid .nm.ph{color:var(--muted);font-style:italic;font-weight:600}
.kid .nm .age{font:600 12px var(--sans);font-style:normal;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.kid .am{font:800 clamp(20px,1.9vw,34px)/1 var(--disp);letter-spacing:-.03em;color:var(--accent);margin-top:10px}
.kid .s{font:400 12.5px/1.45 var(--sans);color:var(--muted);margin-top:6px}

/* ---------- money flow ---------- */
.flowwrap{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(250px,1fr);gap:clamp(16px,2.6vw,48px);margin-top:clamp(14px,2.4vh,30px);align-items:center}
.flowsvg{width:100%;height:auto;display:block}
.flowsvg text{font-family:var(--sans)}
.flowsvg .out{fill:none;stroke:#8C6D46;stroke-width:2.5;stroke-dasharray:6 8;opacity:.75}
.flowsvg .back{fill:none;stroke:rgba(233,194,122,.22);stroke-width:2}
.side{display:grid;gap:clamp(12px,2vh,22px)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--drule);background:transparent;color:var(--ivory);border-radius:999px;padding:9px 16px;font:600 14px var(--sans)}
.chip.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.monthly .v{font:800 clamp(46px,5.6vw,104px)/.9 var(--disp);letter-spacing:-.045em;color:var(--gold);margin-top:8px}
.monthly .s{font:500 clamp(13.5px,1vw,17px)/1.45 var(--sans);color:#BFC3C4;margin-top:8px}
.ticker{border-top:1px solid var(--drule);padding-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.ticker .v{font:800 clamp(24px,2.3vw,42px)/1 var(--disp);letter-spacing:-.03em;margin-top:6px}
.ticker .bar{grid-column:1/-1;height:4px;background:rgba(246,243,238,.12);border-radius:4px;overflow:hidden;margin-top:6px}
.ticker .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8C6D46,#E9C27A)}
.replay{justify-self:start;border:1px solid var(--drule);background:transparent;color:var(--ivory);border-radius:999px;padding:9px 16px;font:600 13px var(--sans);display:inline-flex;gap:8px;align-items:center}
.replay svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

/* ---------- inside GAIF ---------- */
.gband{display:grid;grid-template-columns:auto 1fr auto;gap:clamp(14px,2vw,32px);align-items:center;border:1px solid var(--drule);border-radius:12px;padding:clamp(14px,1.6vw,24px);margin-top:clamp(16px,2.6vh,30px);background:#1c1f25}
.gband .nm{font:800 clamp(22px,2.2vw,40px)/1 var(--disp);letter-spacing:-.03em}
.gband .nm small{display:block;font:500 clamp(12px,.9vw,15px) var(--sans);letter-spacing:0;color:var(--dmuted);margin-top:6px}
.gband .yl{text-align:right}.gband .yl .v{font:800 clamp(30px,3.2vw,58px)/1 var(--disp);letter-spacing:-.04em;color:var(--gold)}
.gband .yl .s{font:500 12.5px var(--sans);color:var(--dmuted);margin-top:4px}
.gband .mid{font:400 clamp(13.5px,1vw,17px)/1.5 var(--sans);color:#BFC3C4}
.inside{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,1.4vw,24px);margin-top:clamp(12px,2vh,22px)}
.icard{border:1px solid var(--drule);border-radius:12px;overflow:hidden;background:#1c1f25;display:flex;flex-direction:column}
.icard .streak{height:clamp(36px,6vh,70px);border-radius:0}
.icard .b{padding:clamp(14px,1.4vw,24px);display:flex;flex-direction:column;flex:1}
.icard .k{font:600 11px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--bronze-lt)}
.icard h3{font:800 clamp(19px,1.7vw,30px)/1.05 var(--disp);letter-spacing:-.025em;margin-top:8px}
.icard p{font:400 clamp(13px,.98vw,16.5px)/1.5 var(--sans);color:#BFC3C4;margin-top:8px}
.icard .st{margin-top:auto;padding-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px;border-top:1px solid var(--drule)}
.icard .st .v{font:800 clamp(20px,1.8vw,32px)/1 var(--disp);letter-spacing:-.03em;color:var(--gold)}
.icard .st .l{font:500 11.5px/1.35 var(--sans);color:var(--dmuted);margin-top:4px}
/* ---------- seven streams ---------- */
.streams{margin-top:clamp(10px,1.8vh,22px)}
.streams svg{width:100%;height:auto;max-height:46vh;display:block}
.streams text{font-family:var(--sans)}
.slist{display:none;list-style:none;padding:0;margin:0;gap:8px}
.slist li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:8px 14px;font:600 15px var(--sans)}
.slist li b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font:700 13px var(--sans)}
.slist li span{font:500 12px var(--sans);color:var(--muted)}
.streams .flowp{fill:none;stroke:#C9B596;stroke-width:2;stroke-dasharray:3 9;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
/* ---------- covered calls ---------- */
.cc{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,1.4vw,24px);margin-top:clamp(18px,3vh,36px)}
.ccs{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:clamp(16px,1.6vw,28px);display:flex;flex-direction:column}
.ccs .no{font:800 clamp(26px,2.4vw,44px)/1 var(--disp);color:var(--accent)}
.ccs h3{font:800 clamp(19px,1.7vw,30px)/1.08 var(--disp);letter-spacing:-.025em;margin-top:10px}
.ccs p{font:400 clamp(13.5px,1vw,17px)/1.5 var(--sans);color:var(--muted);margin-top:8px}
.ccs svg{width:100%;height:auto;margin-top:auto;padding-top:14px;display:block}
.ccs.ink{background:var(--ink);color:var(--ivory);border-color:var(--ink)}.ccs.ink p{color:#BFC3C4}.ccs.ink .no{color:var(--gold)}
/* ---------- product on one page (Studio "The idea" layout) ---------- */
.pname{font:800 clamp(44px,6.4vw,124px)/.94 var(--disp);letter-spacing:-.056em;white-space:nowrap;margin:clamp(8px,1.4vh,16px) 0 0 -4px}
.b2row{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);gap:clamp(18px,3vw,56px);margin-top:clamp(14px,2.6vh,30px);align-items:start}
.pmeta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font:400 clamp(13px,1vw,17px) var(--sans);color:var(--muted)}
.pmeta .aia{font-weight:700;letter-spacing:.22em;color:var(--accent);font-size:clamp(12px,.85vw,15px)}
.pmeta .prep{color:var(--accent)}
.phl{font:700 clamp(22px,2.2vw,40px)/1.08 var(--disp);letter-spacing:-.03em;color:#3B3E45;margin-top:clamp(8px,1.4vh,16px);max-width:17ch}
.pfacts{list-style:none;padding:0;margin:clamp(14px,2.4vh,26px) 0 0;display:grid;gap:0}
.pfacts li{display:grid;grid-template-columns:1fr auto;gap:12px;border-top:1px solid var(--rule);padding:clamp(5px,.85vh,9px) 0;font:400 clamp(12.5px,.95vw,16px)/1.35 var(--sans);color:var(--muted)}
.pfacts li b{font:700 clamp(13px,1vw,17px) var(--disp);color:var(--ink);text-align:right;white-space:nowrap}
.pchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:clamp(12px,2vh,20px)}
.pchips span{font:500 13px var(--sans);padding:7px 11px;border:1px solid var(--rule);border-radius:999px;color:var(--muted);white-space:nowrap}
.pdg{position:relative;background:var(--ink);color:var(--ivory);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.pdg .streak.strip{position:absolute;left:0;right:0;top:0;height:6px;border-radius:0}
.pdg .dgh{display:flex;justify-content:space-between;align-items:center;padding:clamp(16px,2.2vh,24px) clamp(18px,2vw,30px) 0;font:600 clamp(11px,.8vw,13px) var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--dmuted)}
.pdg .dgh b{color:var(--ivory);font-weight:600}
.pdg svg{display:block;width:100%;height:auto;max-height:50vh;padding:4px clamp(10px,1.4vw,22px) 8px}
.pdg text{font-family:var(--sans)}.pdg text:not([fill]){fill:var(--ivory)}
.pdg .tl{font-size:19px;font-weight:600}.pdg .ts{font-size:15.5px;fill:#BCC0C1}.pdg .tk{font-size:14px;fill:#9EA3A5}.pdg .tb{font:700 20px var(--disp)}
.pdg .gy{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform .7s var(--out)}
.pdg .gy.dn{transform-origin:50% 0}
.scr.in .pdg .gy{transform:scaleY(1)}
.pdg .pop{opacity:0;transition:opacity .5s var(--ease)}.scr.in .pdg .pop{opacity:1}

/* ---------- line charts (fees, keep-whole) ---------- */
.lchart{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:clamp(10px,1.2vw,20px)}
.lchart svg{width:100%;height:auto;display:block;max-height:52vh}
.lchart text{font-family:var(--sans)}
.lchart .ln{fill:none;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.lchart.go .ln{transition:stroke-dashoffset 2s var(--ease);stroke-dashoffset:0}
.lchart .fd{opacity:0}.lchart.go .fd{transition:opacity .8s var(--ease) 1.4s;opacity:1}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(250px,1fr);gap:clamp(16px,2.6vw,48px);margin-top:clamp(14px,2.4vh,28px);align-items:start}
.opts{display:grid;gap:clamp(8px,1.4vh,14px)}
.opt{border:1px solid var(--rule);border-radius:12px;padding:clamp(10px,1vw,16px);background:var(--paper);display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:baseline}
.opt .sw{width:14px;height:14px;border-radius:4px;grid-row:span 2;align-self:center}
.opt h3{font:700 clamp(14px,1.15vw,19px)/1.2 var(--disp)}
.opt .a{font:800 clamp(18px,1.7vw,30px)/1 var(--disp);letter-spacing:-.03em;text-align:right;grid-row:span 2;align-self:center}
.opt p{font:400 clamp(12px,.88vw,14.5px)/1.4 var(--sans);color:var(--muted)}
.opt.hi{border-color:var(--accent);box-shadow:0 0 0 2px rgba(140,109,70,.25)}
.lchips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lchips .chip{border-color:var(--rule);color:var(--ink)}.lchips .chip.on{background:var(--ink);color:var(--ivory);border-color:var(--ink)}

/* ---------- GAIF track record ---------- */
.trk{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(240px,1fr);gap:clamp(16px,2.6vw,48px);margin-top:clamp(16px,2.6vh,30px);align-items:end}
.qbars{display:flex;gap:clamp(4px,.7vw,12px);align-items:flex-end;height:clamp(200px,34vh,340px);border-bottom:2px solid var(--ink);position:relative}
.qb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:center;min-width:0}
.qb i{display:block;width:100%;background:linear-gradient(180deg,#E9C27A,#8C6D46);border-radius:4px 4px 0 0;transform-origin:bottom;transform:scaleY(0);transition:transform .9s var(--out)}
.scr.in .qb i{transform:scaleY(1)}
.qb .y{font:700 clamp(10px,.82vw,14px) var(--disp);margin-bottom:6px;white-space:nowrap}
.qlab{display:flex;gap:clamp(4px,.7vw,12px);margin-top:8px}
.qlab div{flex:1;text-align:center;font:500 clamp(9.5px,.72vw,12.5px)/1.3 var(--sans);color:var(--muted);min-width:0}
.qlab div b{display:block;color:var(--ink);font-weight:600}
.tstat{display:grid;gap:clamp(10px,1.6vh,18px)}
.tstat .r{border-top:1px solid var(--rule);padding-top:10px}
.tstat .v{font:800 clamp(26px,2.6vw,48px)/1 var(--disp);letter-spacing:-.035em;margin-top:6px}
.tstat .v.g{color:var(--accent)}
.tstat .s{font:400 clamp(12.5px,.95vw,16px)/1.4 var(--sans);color:var(--muted);margin-top:4px}

/* ---------- real clients (screenshots) ---------- */
.shot{margin-top:clamp(10px,1.6vh,16px);background:#fff;border:1px solid var(--rule);border-radius:12px;padding:clamp(8px,1vw,16px);flex:none;display:flex;justify-content:center}
.shot a{display:block;max-width:100%}
.shot img{display:block;max-width:100%;max-height:min(44vh,560px);width:auto;height:auto;border-radius:6px;margin:0 auto}

/* ---------- birthdays rail ---------- */
.rail{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,1.6vw,28px);margin-top:clamp(26px,4.4vh,52px);position:relative}
.rail::before{content:"";position:absolute;left:0;right:0;top:9px;height:2px;background:var(--rule)}
.stop{position:relative;padding-top:34px}
.stop::before{content:"";position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 6px var(--bg)}
.stop .when{font:600 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.stop h3{font:800 clamp(20px,1.8vw,32px)/1.05 var(--disp);letter-spacing:-.025em;margin-top:8px}
.stop h3.ph{font-style:italic;color:var(--muted)}
.stop .ga{font:500 clamp(13px,1vw,17px) var(--sans);color:var(--muted);margin-top:6px}
.stop .rec{margin-top:16px;border-top:1px solid var(--rule);padding-top:12px}
.stop .rec .v{font:800 clamp(24px,2.3vw,42px)/1 var(--disp);letter-spacing:-.03em;color:var(--accent);margin-top:6px}
.stop .rec .r{font:500 12.5px var(--sans);color:var(--muted);margin-top:6px}

/* ---------- guilt-free ---------- */
.gf{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(18px,3vw,56px);margin-top:clamp(20px,3.4vh,40px);align-items:end}
.stack{display:flex;gap:clamp(10px,1.6vw,28px);align-items:flex-end;height:clamp(240px,40vh,420px)}
.stack .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.stack .bars{display:flex;flex-direction:column;justify-content:flex-end;border-radius:8px;overflow:hidden;transition:height 1.2s var(--out)}
.stack .seg{display:flex;align-items:flex-start;padding:8px 10px;font:700 clamp(11.5px,.9vw,15px)/1.2 var(--disp);color:var(--ivory);min-height:0;overflow:hidden}
.stack .cap{margin-top:12px;font:600 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--dmuted)}
.stack .tot{font:800 clamp(18px,1.9vw,34px)/1 var(--disp);letter-spacing:-.03em;margin-top:6px}
.gfk{display:grid;gap:clamp(12px,2vh,22px)}
.gfk .row{border-top:1px solid var(--drule);padding-top:12px}
.gfk .v{font:800 clamp(28px,3vw,56px)/1 var(--disp);letter-spacing:-.035em;margin-top:6px}
.gfk .s{font:400 clamp(13px,.98vw,16.5px)/1.45 var(--sans);color:var(--dmuted);margin-top:6px}

/* ---------- mechanics flow (how it goes in) ---------- */
.flow{display:grid;grid-template-columns:1.05fr auto 1fr auto 1fr;gap:clamp(10px,1.4vw,24px);align-items:stretch;margin-top:clamp(24px,4vh,48px)}
.fbox{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:clamp(16px,1.8vw,30px);display:flex;flex-direction:column}
.fbox.ink{background:var(--ink);color:var(--ivory);border-color:var(--ink)}
.fbox .yr{font:600 11px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--accent)}
.fbox.ink .yr{color:var(--bronze-lt)}
.fbox .v{font:800 clamp(30px,3.4vw,62px)/1 var(--disp);letter-spacing:-.04em;margin-top:12px}
.fbox .s{font:400 clamp(13px,1vw,17px)/1.45 var(--sans);color:var(--muted);margin-top:10px}
.fbox.ink .s{color:#BFC3C4}
.fbox .rows{margin-top:auto;padding-top:16px;display:grid;gap:8px}
.fbox .row{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--rule);padding-top:8px;font:500 clamp(13px,1vw,17px) var(--sans)}
.fbox.ink .row{border-top-color:var(--drule)}
.fbox .row b{font:700 clamp(14px,1.1vw,19px) var(--disp)}

/* ---------- baton ---------- */
.baton{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,1.4vw,24px);margin-top:clamp(22px,3.6vh,44px)}
.bt{border-radius:12px;padding:clamp(16px,1.6vw,28px);background:#1c1f25;border:1px solid var(--drule);display:flex;flex-direction:column}
.bt .k{font:600 11px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--bronze-lt)}
.bt h3{font:800 clamp(20px,1.75vw,31px)/1.06 var(--disp);letter-spacing:-.025em;margin-top:12px}
.bt p{font:400 clamp(13.5px,1vw,17px)/1.5 var(--sans);color:#BFC3C4;margin-top:10px}
.bt .v{margin-top:auto;padding-top:14px;font:800 clamp(20px,1.8vw,32px)/1 var(--disp);color:var(--gold)}
.bt.hi{background:var(--ivory);color:var(--ink);border-color:var(--ivory)}
.bt.hi .k{color:var(--accent)}.bt.hi p{color:var(--muted)}.bt.hi .v{color:var(--accent)}

/* ---------- compounding after handover ---------- */
.cwrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(250px,1fr);gap:clamp(16px,2.6vw,48px);margin-top:clamp(14px,2.4vh,28px);align-items:start}
.cchart{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:clamp(10px,1.2vw,20px)}
.cchart svg{width:100%;height:auto;display:block}
.cchart text{font-family:var(--sans)}
.cchart .ln{fill:none;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.cchart .ar{opacity:0}
.cchart.go .ln{transition:stroke-dashoffset 2.2s var(--ease);stroke-dashoffset:0}
.cchart.go .ar{transition:opacity 1.2s var(--ease) .6s;opacity:1}
.cctl{display:grid;gap:12px}
.cctl .chip{border-color:var(--rule);color:var(--ink)}
.cctl .chip.on{background:var(--ink);color:var(--ivory);border-color:var(--ink)}
.cms{display:grid;gap:clamp(6px,1vh,12px);margin-top:4px}
.cms .m{border-top:1px solid var(--rule);padding-top:10px;display:grid;grid-template-columns:1fr auto;gap:2px 16px;align-items:baseline}
.cms .m .y{font:600 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.cms .m .a{font:800 clamp(22px,2.1vw,38px)/1 var(--disp);letter-spacing:-.035em;text-align:right;grid-row:span 2}
.cms .m .b{font:500 12.5px var(--sans);color:var(--muted)}
.cms .m.hi .a{color:var(--accent)}
.key{display:flex;gap:20px;flex-wrap:wrap;margin-top:10px;font:500 13px var(--sans);color:var(--muted)}
.key i{display:inline-block;width:22px;height:10px;border-radius:2px;vertical-align:middle;margin-right:8px}

/* ---------- trust comparison ---------- */
.cmp{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:clamp(18px,3vw,56px);margin-top:clamp(20px,3.4vh,40px);align-items:start}
.cbar{margin-bottom:clamp(16px,2.6vh,28px)}
.cbar .hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.cbar .hd b{font:700 clamp(16px,1.3vw,22px) var(--disp)}
.cbar .hd span{font:800 clamp(24px,2.4vw,44px)/1 var(--disp);letter-spacing:-.03em}
.cbar .tk{height:clamp(30px,5vh,48px);background:#EAE5DA;border-radius:8px;margin-top:10px;overflow:hidden}
.cbar .tk i{display:block;height:100%;width:0;border-radius:8px;transition:width 1.4s var(--out)}
.cbar .s{font:400 clamp(12.5px,.95vw,16px) var(--sans);color:var(--muted);margin-top:8px}
.ticks{list-style:none;padding:0;margin:0;display:grid;gap:clamp(10px,1.8vh,18px)}
.ticks li{display:grid;grid-template-columns:28px 1fr;gap:12px;font:400 clamp(14px,1.08vw,18.5px)/1.45 var(--sans);color:var(--muted);border-top:1px solid var(--rule);padding-top:12px}
.ticks li b{color:var(--ink);font-weight:600;display:block}
.ticks li::before{content:"✓";font:800 18px var(--disp);color:var(--accent)}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;margin-top:clamp(16px,2.6vh,30px);background:var(--paper);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.tbl th{font:600 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:right;padding:14px clamp(10px,1.2vw,22px);border-bottom:1.5px solid var(--rule);vertical-align:bottom}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{font:500 clamp(14px,1.15vw,20px) var(--sans);text-align:right;padding:clamp(8px,1.15vh,14px) clamp(10px,1.2vw,22px);border-bottom:1px solid #EDE8DD}
.tbl tr:last-child td{border-bottom:0}
.tbl td.k{font:700 clamp(14px,1.1vw,19px) var(--disp)}
.tbl tr.hi td{background:#FAF6EE}
.tw{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(240px,1fr);gap:clamp(16px,2.6vw,48px);align-items:start}

/* ---------- calculator ---------- */
.calc{display:grid;grid-template-columns:minmax(280px,1fr) minmax(0,1.5fr);gap:clamp(16px,2.6vw,48px);margin-top:clamp(18px,3vh,36px)}
.ctl{display:grid;gap:clamp(16px,2.6vh,28px);align-content:start}
.sl .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sl .val{font:800 clamp(22px,2vw,36px)/1 var(--disp);letter-spacing:-.03em}
.sl input{width:100%;margin-top:12px;accent-color:#8C6D46;height:28px}
.sl .ends{display:flex;justify-content:space-between;font:500 12px var(--sans);color:var(--muted)}
.outc{background:var(--ink);color:var(--ivory);border-radius:14px;padding:clamp(18px,2vw,36px);display:grid;gap:clamp(12px,2vh,22px);align-content:start}
.outc .row{display:grid;grid-template-columns:1fr auto;gap:6px clamp(12px,2vw,36px);align-items:baseline;border-top:1px solid var(--drule);padding-top:clamp(10px,1.6vh,16px)}
.outc .row:first-child{border-top:0;padding-top:0}
.outc .k{font:500 clamp(14px,1.1vw,18px)/1.35 var(--sans);color:#D5D8D9}
.outc .k small{display:block;font-size:12.5px;color:var(--dmuted);margin-top:3px}
.outc .a{font:800 clamp(24px,2.5vw,46px)/1 var(--disp);letter-spacing:-.035em;text-align:right}
.outc .a.g{color:var(--gold)}
.outc .cap{font:400 12.5px/1.5 var(--sans);color:var(--dmuted)}
.agesrow{display:flex;gap:8px;flex-wrap:wrap}
.agesrow span{border:1px solid var(--rule);border-radius:999px;padding:6px 12px;font:500 13px var(--sans);color:var(--muted)}
.agesrow span b{color:var(--ink);font-weight:700}

/* ---------- lists ---------- */
.steps{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(12px,2vw,36px) clamp(16px,3vw,56px);margin-top:clamp(20px,3.4vh,40px)}
.st{border-top:2px solid var(--ink);padding-top:14px;display:grid;grid-template-columns:auto 1fr;gap:6px 18px}
.dark .st{border-top-color:var(--bronze-lt)}
.st .no{font:800 clamp(26px,2.4vw,44px)/1 var(--disp);color:var(--accent);grid-row:span 2}
.dark .st .no{color:var(--gold)}
.st h3{font:700 clamp(19px,1.6vw,28px)/1.15 var(--disp);letter-spacing:-.02em}
.st p{font:400 clamp(14px,1.05vw,18px)/1.5 var(--sans);color:var(--muted)}
.dark .st p{color:#BFC3C4}
.notes{columns:2;column-gap:clamp(20px,3vw,56px);margin-top:clamp(18px,3vh,32px);padding:0;list-style:none}
.notes li{break-inside:avoid;font:400 clamp(13px,.98vw,16.5px)/1.55 var(--sans);color:var(--muted);padding:10px 0;border-top:1px solid var(--rule)}
.notes li b{color:var(--ink);font-weight:600}
.rep{margin-top:clamp(16px,2.6vh,28px);display:flex;align-items:center;gap:20px;border-top:2px solid var(--ink);padding-top:16px}
.rep img{height:34px}
.rep p{font:500 13px/1.5 var(--sans);color:var(--muted)}

/* ---------- footer pill + nav ---------- */
#foot{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:25;font:500 12px var(--sans);color:var(--muted);background:rgba(244,241,234,.92);border:1px solid var(--rule);border-radius:999px;padding:8px 16px;white-space:nowrap;backdrop-filter:blur(6px)}
#foot.dark{background:rgba(22,24,29,.88);border-color:var(--drule);color:var(--dmuted)}
.tapnext{position:fixed;right:clamp(12px,2vw,32px);bottom:12px;z-index:26;display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:var(--ivory);border:0;border-radius:999px;padding:12px 20px;font:600 14px var(--sans)}
.tapnext svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
#bar.dark ~ .tapnext{background:var(--ivory);color:var(--ink)}
#menu{position:fixed;top:72px;right:clamp(12px,2vw,32px);z-index:40;background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:8px;min-width:300px;box-shadow:0 18px 50px rgba(0,0,0,.18);display:none;max-height:calc(100vh - 90px);overflow:auto;color:var(--ink)}
#menu.on{display:block}
#menu button{display:flex;gap:14px;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:10px 12px;font:500 15px var(--sans)}
#menu button:hover,#menu button.cur{background:var(--bg)}
#menu button span{color:var(--muted);min-width:22px;font-weight:600}

/* ---------- phone / portrait ---------- */
@media (max-width:860px),(max-aspect-ratio:1/1){
  #bar{height:56px;gap:12px}#deck{top:56px}#menu{top:62px}
  #bar .ttl,#bar .sep,#bar .sec{display:none}
  #bar .mark{height:22px}
  .scr{padding-top:44px;padding-bottom:110px}
  #foot{bottom:auto;top:56px;left:0;right:0;transform:none;border-radius:0;border-width:0 0 1px;font-size:10.5px;text-align:center;padding:5px 10px}
  .cov-strip{grid-template-columns:1fr;gap:14px}.cov-strip .ar{display:none}
  .tree{grid-template-columns:1fr;row-gap:28px}.conn{display:none}
  .setup,.flow{grid-template-columns:1fr}.setup .arrow,.flow .arrow{transform:rotate(90deg);justify-self:center}
  .flowwrap,.gf,.cmp,.calc,.tw,.steps{grid-template-columns:1fr}
  .rail{grid-template-columns:1fr 1fr;row-gap:28px}.rail::before{display:none}
  .baton{grid-template-columns:1fr}
  .cwrap{grid-template-columns:1fr}
  .inside,.cc{grid-template-columns:1fr}.trk,.two{grid-template-columns:minmax(0,1fr)}
  .b2row{grid-template-columns:minmax(0,1fr)}.pname{white-space:normal;font-size:clamp(40px,12vw,64px)}
  .qbars,.qlab{gap:3px}.qb .y{font-size:8px;letter-spacing:-.02em}.qlab div{font-size:9px}.qlab .px{display:none}
  .streams svg{display:none}.slist{display:grid}
  .gband{grid-template-columns:1fr}.gband .yl{text-align:left}
  .notes{columns:1}
  .stack{height:300px}
  .tbl th{letter-spacing:.06em;font-size:10px;padding:10px 6px}.tbl td{padding:10px 6px}
  .tapnext{padding:10px 16px}
}
@media print{body{overflow:visible}#bar,#foot,.tapnext,#menu{display:none}#deck{position:static}.scr{position:relative;visibility:visible;opacity:1;height:100vh;page-break-after:always}.scr .rv .w>span,.scr .fu,.scr .streak{transform:none!important;opacity:1!important;clip-path:none!important}}

@media (max-width:860px),(max-aspect-ratio:1/1){.rail.run::after{display:none}}
.pdg.big{flex:none}.pdg.big svg{max-height:none;padding:6px clamp(14px,2vw,34px) 4px}
.pdg .hk{transition:opacity .45s var(--ease)}
.pdg.focus .hk{opacity:.18}.pdg.focus .hk.on,.pdg.focus .hk.on .hk{opacity:1}
.pdg.focus .hk.on rect{filter:drop-shadow(0 0 10px rgba(233,194,122,.55))}
.pfd{display:grid;grid-template-columns:auto auto 1fr;gap:6px 22px;align-items:baseline;border-bottom:1px solid var(--drule);padding:clamp(16px,2.2vh,24px) clamp(18px,2vw,30px) clamp(12px,1.8vh,18px);min-height:64px}
.pfd .pfk{font:600 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--bronze-lt)}
.pfd .pfv{font:800 clamp(20px,1.9vw,32px)/1 var(--disp);letter-spacing:-.03em;color:var(--gold);white-space:nowrap}
.pfd .pft{font:400 clamp(13.5px,1.05vw,17px)/1.45 var(--sans);color:#D5D8D9}
@media (max-width:860px),(max-aspect-ratio:1/1){.pfd{grid-template-columns:1fr}.pfd .pfv{white-space:normal}}
.rail.spot .stop{font:inherit;color:inherit;text-align:left;background:none;border:0;cursor:pointer;border-radius:12px;transition:transform .55s var(--out),opacity .45s var(--ease),background .45s;transform-origin:50% 0}
.rail.spot.focus .stop{opacity:.32}
.rail.spot .stop.on{opacity:1;transform:scale(1.07);background:var(--paper);box-shadow:0 14px 40px rgba(22,24,29,.10);z-index:2}
.rail.spot .stop.on::before{box-shadow:0 0 0 6px var(--bg),0 0 0 10px rgba(201,150,63,.35)}
.rail.spot .stop.on .rec .v{color:var(--accent)}
.stdet{flex:none;margin-top:clamp(16px,2.6vh,30px);background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:clamp(14px,1.6vw,24px);min-height:120px;opacity:0;transform:translateY(10px);transition:opacity .5s var(--ease),transform .6s var(--out)}
.stdet.show{opacity:1;transform:none}
.sbars{position:relative;display:grid;gap:10px;margin-top:10px;padding-top:20px}
.sbar .goal{position:absolute;top:-6px;bottom:-6px;border-left:2px dashed var(--accent);z-index:1;pointer-events:none}
.sbar .goal b{position:absolute;top:-20px;left:6px;font:700 12px var(--sans);color:var(--accent);white-space:nowrap}
.srow{display:grid;grid-template-columns:110px 1fr 90px;gap:8px;align-items:center}
.srow .sl{font:600 13px var(--sans);color:var(--muted)}.srow.pl .sl{color:var(--ink)}
.srow .sv{font:800 clamp(18px,1.5vw,24px)/1 var(--disp);text-align:right}.srow.pl .sv{color:var(--accent)}
.sbar{position:relative;display:flex;height:clamp(28px,4vh,38px);border-radius:8px;overflow:visible;background:#EFEAE0;min-width:0}.srow>*{min-width:0}.sbar i:first-child{border-radius:8px 0 0 8px}
.sbar i{display:flex;align-items:center;justify-content:center;font:700 12px var(--sans);font-style:normal;color:#fff;white-space:nowrap;overflow:hidden;border-right:2px solid var(--paper);animation:sgrow .9s var(--out) both}
@keyframes sgrow{from{max-width:0}to{max-width:100%}}
.skey{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font:500 12.5px var(--sans);color:var(--muted)}
.skey i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.ssay{font:400 clamp(14px,1.1vw,18px)/1.5 var(--sans);color:var(--ink);margin-top:10px;max-width:110ch}
@media (max-width:860px),(max-aspect-ratio:1/1){.rail.spot .stop.on{transform:none}.srow{grid-template-columns:70px minmax(0,1fr) 64px}.sbar i{font-size:10px}.sbar .goal b{font-size:10.5px}}
/* ---------- Flexi Retirement additions ---------- */
#flowbox svg{width:100%;height:auto;display:block;max-height:46vh}
#flowbox text{font-family:var(--sans)}
.eqb .fine{max-width:none}
.dark .skey{color:#9EA3A5}
.dv2 .tbl td,.dv2 .tbl th{padding:8px 10px;font-size:clamp(13px,1vw,16px)}
@media (max-width:860px),(max-aspect-ratio:1/1){.outc .row{grid-template-columns:minmax(0,1fr)}.outc .a{text-align:left}.calc{grid-template-columns:minmax(0,1fr)}}
</style>

<script>
/* =====================================================================
   CONFIG — Singlife Flexi Retirement II, S$1,660 a month for 20 years
   Product rules: Singlife Flexi Retirement II Product Summary (Dec 2025).
   Premium: scaled from Singlife's brochure example (GMI S$1,200, 5-year
   premium S$41,451.05 a year, 10-year accumulation, income 65 to 85).
   ===================================================================== */
const CONFIG = {
  date: "November 2026",
  gmi: 1660, anb: 51, ppt: 5, acc: 10, ipp: 20,
  exAP: 41451.05, exGMI: 1200,
  rbRate: 15, amiRate: 0.03,
  repLine: "Prepared by AWM for discussion. Not a Singlife-issued document. Figures are an estimate until confirmed by Singlife’s Policy Illustration."
};
/* Appendix A, 5-year premium term, 5–10 year accumulation, 5–24 year payout (per S$1,000 GMI) */
const BANDS = [[17,24,13,379],[25,29,13,380],[30,34,13,382],[35,39,13,386],[40,44,13,393],[45,49,12,406],[50,54,11,431],[55,59,10,472],[60,65,7,543]];

/* ---------- formatting ---------- */
const S = n => (n < 0 ? "−" : "") + "S$" + Math.round(Math.abs(n)).toLocaleString("en-SG");
const K = n => "S$" + (Math.abs(n) >= 1000 ? (Math.round(n / 100) / 10).toLocaleString("en-SG") + "k" : Math.round(n));
const P = (n, d) => (n * 100).toFixed(d == null ? 0 : d) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- the model (same maths as the Excel file) ---------- */
function band(anb){ let b = BANDS[0]; BANDS.forEach(x => { if (anb >= x[0]) b = x; }); return b; }
function irr(fl){
  const npv = r => fl.reduce((a, c, t) => a + c / Math.pow(1 + r, t), 0);
  let lo = -0.5, hi = 0.5; for (let i = 0; i < 200; i++){ const m = (lo + hi) / 2; if (npv(m) > 0) lo = m; else hi = m; } return (lo + hi) / 2;
}
function model(o){
  o = Object.assign({ gmi: CONFIG.gmi, anb: CONFIG.anb, scale: 1, ami: true }, o || {});
  const { ppt, acc, ipp } = CONFIG, end = ppt + acc, last = end + ipp;
  const ap = Math.round(o.gmi / CONFIG.exGMI * CONFIG.exAP * 100) / 100;
  const b = band(o.anb), lo = b[2] * o.scale, hi = b[3] * o.scale;
  let rb = 0; const rows = [];
  for (let y = 1; y <= end; y++){
    const tp = ap * Math.min(y, ppt), dec = Math.round((rb + tp) * CONFIG.rbRate / 1000 * o.scale * 100) / 100;
    rb += dec; rows.push({ y, age: o.anb - 2 + y, prem: y <= ppt ? ap : 0, tp, dec, rb });
  }
  const m = Math.pow(1 + CONFIG.amiRate, 1 / 12) - 1, ann = (1 - Math.pow(1 + m, -ipp * 12)) / m;
  const amiM = o.ami ? rb / ann : 0;
  let cum = 0, gPaid = 0, aPaid = 0;
  rows.forEach(r => { r.g = 0; r.mcb = 0; r.ami = 0; r.mti = 0; r.cum = 0; r.db = 1.05 * r.tp + r.rb; });
  for (let k = 1; k <= ipp; k++){
    const g = o.gmi * 12, rate = lo + (hi - lo) * (k - 1) / Math.max(1, ipp - 1), mcb = g * rate / 1000, ami = amiM * 12;
    cum += g + mcb + ami; gPaid += g; aPaid += ami;
    rows.push({ y: end + k, age: o.anb - 2 + end + k, prem: 0, tp: ap * ppt, dec: 0, rb: o.ami ? rb : 0, g, rate, mcb, ami, mti: g + mcb + ami, cum,
      db: Math.max(1.05 * ap * ppt - gPaid, 0) + (o.ami ? Math.max(rb - aPaid, 0) : 0) });
  }
  const tp = ap * ppt, gTot = o.gmi * 12 * ipp;
  const mcbTot = rows.reduce((a, r) => a + r.mcb, 0), amiTot = o.ami ? amiM * 12 * ipp : rb;
  const flG = rows.map(r => r.g - r.prem), flI = rows.map(r => r.mti - r.prem);
  if (!o.ami) flI[end - 1] += rb;
  const pay = rows.slice(end);
  return { o, ap, tp, rb, amiM, gTot, mcbTot, amiTot, ngTot: mcbTot + amiTot, tot: gTot + mcbTot + amiTot,
    first: pay[0], lastY: pay[pay.length - 1], rows, lo, hi, end, last, irrG: irr(flG), irrI: irr(flI),
    ageStart: o.anb - 1 + end, ageEnd: o.anb - 1 + last };
}
const M = model();
const C = { gmi: "#16181D", gmiD: "#F6F3EE", ami: "#2B6F73", amiD: "#6FB3B6", mcb: "#E9C27A", prem: "#8C6D46", premD: "#C9B596" };

/* ---------- streak art (same generator as the Client Studio) ---------- */
const PAL = {
  open: ["#F3C26B", "#E9A23B", "#F7E9CF", "#C98A3A", "#2B6F73", "#FFF6E3", "#8C6D46", "#1C2326"],
  gold: ["#F0CD85", "#C9963F", "#FAF0D7", "#8C6D46", "#E8B45A", "#2B2118", "#FFF8E8"],
  sea: ["#DDE6EA", "#9CB7C2", "#F6F3EE", "#4D6E7B", "#C9B596", "#22343C", "#FFFFFF"]
};
function hash(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function grad(key, salt){
  const Pl = PAL[key] || PAL.open, r = rng(hash(key + "|" + salt)), st = []; let x = 0;
  while (x < 100){
    const c = Pl[Math.floor(r() * Pl.length)], thin = r() < .16, w = thin ? .18 + r() * .3 : 1.2 + r() * 5.2;
    if (thin) st.push(c + " " + x.toFixed(2) + "%", c + " " + Math.min(100, x + w).toFixed(2) + "%");
    else st.push(c + " " + Math.min(100, x + w / 2).toFixed(2) + "%");
    x += w;
  }
  return "linear-gradient(90deg," + st.join(",") + ")";
}
const streak = (key, salt, style, d, cls) => '<span class="streak ' + (cls || "") + '" aria-hidden="true" style="--g:' + grad(key, salt) + ';' + (d != null ? "--d:" + d + "s;" : "") + (style || "") + '"><i></i><b></b></span>';

/* ---------- charts ---------- */
function flowSVG(m, sel){
  const W = 1000, H = 430, L = 64, R = 16, T = 22, B = 58, n = m.rows.length;
  const maxP = Math.max(...m.rows.map(r => r.mti)) || 1, maxN = m.ap;
  const sc = (H - T - B) / (maxP + maxN), y0 = T + maxP * sc, bw = (W - L - R) / n;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Premiums paid and income received each policy year">`;
  [maxP, maxP / 2].forEach(v => { const y = y0 - v * sc; s += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="rgba(246,243,238,.10)"/><text x="${L - 8}" y="${y + 4}" text-anchor="end" font-size="13" fill="#9EA3A5">${K(v)}</text>`; });
  s += `<text x="${L - 8}" y="${y0 + maxN * sc + 4}" text-anchor="end" font-size="13" fill="#9EA3A5">−${K(maxN)}</text>`;
  m.rows.forEach((r, i) => {
    const x = L + i * bw + bw * .14, w = bw * .72, on = sel === r.y, op = sel && !on ? .42 : 1;
    s += `<g opacity="${op}" data-yr="${r.y}" style="cursor:pointer">`;
    s += `<rect x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent"/>`;
    if (r.prem) s += `<rect class="yb dn" x="${x}" y="${y0}" width="${w}" height="${r.prem * sc}" rx="2" fill="${C.premD}"/>`;
    let yy = y0;
    [[r.g, C.gmiD], [r.ami, C.amiD], [r.mcb, C.mcb]].forEach(([v, c]) => { if (v > 0){ const h = v * sc; yy -= h; s += `<rect class="yb" x="${x}" y="${yy}" width="${w}" height="${h}" fill="${c}"/>`; } });
    if (!r.prem && !r.mti){ const h = Math.max(2, r.rb / maxN * 40); s += `<rect class="yb" x="${x}" y="${y0 - h}" width="${w}" height="${h}" rx="2" fill="rgba(201,181,150,.45)"/>`; }
    s += `</g>`;
    if (r.y === 1 || (r.y % 5 === 0 && r.y !== m.end) || r.y === m.end + 1) s += `<text x="${L + i * bw + bw / 2}" y="${H - B + 22}" text-anchor="middle" font-size="13" fill="${on ? "#E9C27A" : "#9EA3A5"}">Yr ${r.y}</text><text x="${L + i * bw + bw / 2}" y="${H - B + 40}" text-anchor="middle" font-size="12" fill="#6F7476">age ${r.age}</text>`;
  });
  s += `<line x1="${L}" x2="${W - R}" y1="${y0}" y2="${y0}" stroke="#F6F3EE" stroke-width="1.5"/>`;
  const xa = L + CONFIG.ppt * bw, xb = L + m.end * bw;
  s += `<line x1="${xa}" x2="${xa}" y1="${T}" y2="${H - B}" stroke="rgba(246,243,238,.18)" stroke-dasharray="4 6"/><line x1="${xb}" x2="${xb}" y1="${T}" y2="${H - B}" stroke="rgba(246,243,238,.18)" stroke-dasharray="4 6"/>`;
  s += `<text x="${L + 4}" y="${T + 4}" font-size="12" fill="#9EA3A5" letter-spacing="1.5">PAY</text><text x="${xa + 6}" y="${T + 4}" font-size="12" fill="#9EA3A5" letter-spacing="1.5">GROW</text><text x="${xb + 6}" y="${T + 4}" font-size="12" fill="#9EA3A5" letter-spacing="1.5">GET PAID</text>`;
  return s + `</svg>`;
}
function rbSVG(m){
  const W = 1000, H = 360, L = 70, R = 20, T = 30, B = 46, rows = m.rows.slice(0, m.end), n = rows.length, mx = m.rb * 1.1;
  const bw = (W - L - R) / n, sc = (H - T - B) / mx;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Accumulated reversionary bonus by year">`;
  [mx / 2, mx].forEach(v => { const y = H - B - v * sc; s += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#EDE8DD"/><text x="${L - 8}" y="${y + 4}" text-anchor="end" font-size="13" fill="#5F626A">${K(v)}</text>`; });
  rows.forEach((r, i) => {
    const x = L + i * bw + bw * .16, w = bw * .68, h = r.rb * sc, prev = (r.rb - r.dec) * sc;
    s += `<rect class="yb" x="${x}" y="${H - B - prev}" width="${w}" height="${prev}" fill="#C9B596"/>`;
    s += `<rect class="yb" x="${x}" y="${H - B - h}" width="${w}" height="${h - prev}" fill="#8C6D46"/>`;
    s += `<text x="${x + w / 2}" y="${H - B + 20}" text-anchor="middle" font-size="12.5" fill="#5F626A">${r.y}</text>`;
    if (r.y === CONFIG.ppt || r.y === m.end) s += `<text class="pop" x="${x + w / 2}" y="${H - B - h - 10}" text-anchor="middle" font-size="15" font-weight="700" fill="#16181D">${K(r.rb)}</text>`;
  });
  s += `<line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="#16181D" stroke-width="1.5"/>`;
  s += `<text x="${L}" y="${H - 6}" font-size="12" fill="#5F626A">Policy year</text>`;
  return s + `</svg>`;
}
function mcbSVG(m){
  const W = 1000, H = 330, L = 70, R = 20, T = 30, B = 50, rows = m.rows.slice(m.end), n = rows.length;
  const mx = Math.max(...rows.map(r => (r.g + r.mcb) / 12)) * 1.08, bw = (W - L - R) / n, sc = (H - T - B) / mx;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Guaranteed monthly income and monthly cash bonus by payout year">`;
  rows.forEach((r, i) => {
    const x = L + i * bw + bw * .14, w = bw * .72, hg = r.g / 12 * sc, hm = r.mcb / 12 * sc;
    s += `<rect class="yb" x="${x}" y="${H - B - hg}" width="${w}" height="${hg}" fill="#16181D"/>`;
    s += `<rect class="yb" x="${x}" y="${H - B - hg - hm}" width="${w}" height="${hm}" fill="#E9C27A"/>`;
    if (i === 0 || i === n - 1 || i === 9) s += `<text class="pop" x="${x + w / 2}" y="${H - B - hg - hm - 8}" text-anchor="middle" font-size="14" font-weight="700" fill="#8C6D46">+${S(r.mcb / 12)}</text>`;
    if (i % 2 === 0 || i === n - 1) s += `<text x="${x + w / 2}" y="${H - B + 20}" text-anchor="middle" font-size="12.5" fill="#5F626A">${r.age}</text>`;
  });
  s += `<text x="${L + 10}" y="${H - B - (CONFIG.gmi * sc) / 2}" font-size="15" font-weight="600" fill="#F6F3EE">${S(m.o.gmi)} guaranteed</text>`;
  s += `<line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="#16181D" stroke-width="1.5"/>`;
  s += `<text x="${L}" y="${H - 8}" font-size="12" fill="#5F626A">Age during the payout year</text>`;
  return s + `</svg>`;
}

/* ---------- interactions (called after the deck is built) ---------- */
let FM = M;
function setYr(y){
  const r = FM.rows[y - 1]; if (!r) return;
  document.getElementById("flowbox").innerHTML = flowSVG(FM, y);
  document.getElementById("yrS").value = y;
  const ph = y <= CONFIG.ppt ? "Paying premiums" : y <= FM.end ? "Growing" : "Getting paid";
  document.getElementById("yrL").textContent = "Year " + y + " · age " + r.age + " · " + ph;
  if (r.mti){
    document.getElementById("yrV").textContent = S(r.mti / 12) + "/mo";
    document.getElementById("yrT").innerHTML = `${S(r.g / 12)} guaranteed + ${S(r.ami / 12)} AMI + ${S(r.mcb / 12)} cash bonus`;
  } else if (r.prem){
    document.getElementById("yrV").textContent = "−" + S(r.prem);
    document.getElementById("yrT").textContent = "Premium for the year. Bonus pot now " + S(r.rb) + ".";
  } else {
    document.getElementById("yrV").textContent = S(r.rb);
    document.getElementById("yrT").textContent = "Bonus pot. Nothing to pay; " + S(r.dec) + " added this year.";
  }
  document.getElementById("yrP").textContent = S(r.tp);
  document.getElementById("yrR").textContent = S(r.cum || 0);
  document.getElementById("yrB").style.width = Math.min(100, (r.cum || 0) / FM.tot * 100) + "%";
  document.getElementById("yrD").textContent = S(r.db);
  document.querySelectorAll("#flowbox [data-yr]").forEach(g => g.onclick = () => setYr(+g.dataset.yr));
  requestAnimationFrame(() => document.querySelectorAll("#flowbox .yb").forEach(b => b.style.transition = "none"));
}
function wire(){
  const yrS = document.getElementById("yrS");
  yrS.oninput = () => setYr(+yrS.value);
  document.querySelectorAll("[data-sc]").forEach(b => b.onclick = () => {
    document.querySelectorAll("[data-sc]").forEach(x => x.classList.toggle("on", x === b));
    FM = model({ scale: +b.dataset.sc }); setYr(+yrS.value);
  });
  document.querySelectorAll("[data-an]").forEach(b => b.onclick = () => {
    document.querySelectorAll("[data-an]").forEach(x => x.classList.toggle("on", x === b));
    const r = b.dataset.an === "first" ? M.first : b.dataset.an === "last" ? M.lastY : M.rows[M.end + 9];
    document.getElementById("anat").innerHTML = anat(r);
  });
  ["iG", "iA"].forEach(id => document.getElementById(id).oninput = calc);
  document.querySelectorAll("[data-cs],[data-ca]").forEach(b => b.onclick = () => {
    const k = b.dataset.cs != null ? "data-cs" : "data-ca";
    document.querySelectorAll("[" + k + "]").forEach(x => x.classList.toggle("on", x === b)); calc();
  });
  const lg = document.getElementById("repLogo"), mk = document.querySelector("#bar .mark.ik"); if (lg && mk) lg.src = mk.src;
  setYr(M.end + 1); calc();
}
function calc(){
  const g = +document.getElementById("iG").value, age = +document.getElementById("iA").value;
  const sc = +document.querySelector("[data-cs].on").dataset.cs, ami = document.querySelector("[data-ca].on").dataset.ca === "1";
  const m = model({ gmi: g, anb: age + 1, scale: sc, ami });
  document.getElementById("cG").textContent = S(g); document.getElementById("cA").textContent = age;
  const row = (k, sm, a, cls) => `<div class="row"><div class="k">${k}${sm ? `<small>${sm}</small>` : ""}</div><div class="a ${cls || ""}">${a}</div></div>`;
  document.getElementById("cOut").innerHTML =
    row("Premium a year, for 5 years", "Estimate, scaled from Singlife’s example", S(m.ap)) +
    row("Total premiums", "", S(m.tp)) +
    row("Guaranteed income, total", `${S(g)} a month × 240 · ${P(m.gTot / m.tp)} of premiums`, S(m.gTot), "g") +
    row("Non-guaranteed, total", `Cash bonus ${S(m.mcbTot)} + ${ami ? "AMI" : "lump sum"} ${S(m.amiTot)}`, S(m.ngTot)) +
    row("Monthly income, with bonuses", `From about age ${m.ageStart} to ${m.ageEnd}`, S(m.first.mti / 12) + "–" + S(m.lastY.mti / 12)) +
    row("Total payout", `≈ ${P(m.irrI, 1)} a year · guaranteed part ≈ ${P(m.irrG, 1)} a year`, S(m.tot), "g") +
    `<div class="cap">${g < 300 ? "Below the S$300 minimum." : "Bonus figures are not guaranteed."} Age today ${age} means entry age ${age + 1} ANB.</div>`;
}

/* =====================================================================
   DECK ENGINE (unchanged from the template)
   ===================================================================== */
const deck = document.getElementById("deck"), bar = document.getElementById("bar"), foot = document.getElementById("foot");
const pg = document.getElementById("pg"), sec = document.getElementById("sec"), prog = document.getElementById("progress");
const menu = document.getElementById("menu"), mbtn = document.getElementById("mbtn"), tapnext = document.getElementById("tapnext");
deck.innerHTML = SCREENS.map((s, i) => `<section class="scr ${s.theme}" id="s${i + 1}" aria-label="${esc(s.sec)}">${s.html}</section>`).join("");
menu.innerHTML = SCREENS.map((s, i) => `<button type="button" data-go="${i}"><span>${i + 1}</span>${esc(s.sec)}</button>`).join("");
const els = [...deck.children]; let cur = -1;
els.forEach((el, i) => { if (i) { const n = el.querySelector('.kick .n'); if (n) n.textContent = String(i).padStart(2, '0'); } });

function go(i){
  i = Math.max(0, Math.min(SCREENS.length - 1, i));
  if (i === cur) return;
  if (cur >= 0){ els[cur].classList.remove("on", "in"); }
  cur = i; const el = els[i], dark = SCREENS[i].theme === "dark";
  el.scrollTop = 0; el.classList.add("on");
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("in")));
  bar.classList.toggle("dark", dark); foot.classList.toggle("dark", dark);
  pg.textContent = (i + 1) + " / " + SCREENS.length; sec.textContent = SCREENS[i].sec;
  prog.style.width = ((i + 1) / SCREENS.length * 100) + "%";
  document.getElementById("prev").disabled = i === 0;
  document.getElementById("next").disabled = i === SCREENS.length - 1;
  tapnext.style.display = i === SCREENS.length - 1 ? "none" : "";
  [...menu.children].forEach((b, j) => b.classList.toggle("cur", j === i));
  if (location.hash !== "#/" + (i + 1)) history.replaceState(null, "", "#/" + (i + 1));
  if (SCREENS[i].onShow) setTimeout(SCREENS[i].onShow, 350);
}
const fromHash = () => { const m = /^#\/(\d+)/.exec(location.hash); return m ? +m[1] - 1 : 0; };
document.getElementById("prev").onclick = () => go(cur - 1);
document.getElementById("next").onclick = () => go(cur + 1);
tapnext.onclick = () => go(cur + 1);
mbtn.onclick = e => { e.stopPropagation(); const on = menu.classList.toggle("on"); mbtn.setAttribute("aria-expanded", on); };
menu.onclick = e => { const b = e.target.closest("[data-go]"); if (b){ go(+b.dataset.go); menu.classList.remove("on"); mbtn.setAttribute("aria-expanded", false); } };
document.addEventListener("click", e => { if (!menu.contains(e.target) && e.target !== mbtn) menu.classList.remove("on"); });
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea,select")) return;
  if (["ArrowRight", "PageDown", " "].includes(e.key)){ e.preventDefault(); go(cur + 1); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)){ e.preventDefault(); go(cur - 1); }
  else if (e.key === "Home") go(0); else if (e.key === "End") go(SCREENS.length - 1);
  else if (e.key === "Escape") menu.classList.remove("on");
});
let tx = null, ty = null;
deck.addEventListener("touchstart", e => { if (e.target.closest("[data-nonav]")) { tx = null; return; } tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
deck.addEventListener("touchend", e => {
  if (tx == null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) go(cur + (dx < 0 ? 1 : -1));
}, { passive: true });
window.addEventListener("hashchange", () => go(fromHash()));
wire();
go(fromHash());
</script>
